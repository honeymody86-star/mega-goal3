<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grammar L11">
<meta name="theme-color" content="#0b0a12">
<title>Comparatives · Grammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a12;--bg2:#15131f;--card:#1d1a2b;--card2:#26223a;--line:#3a3456;--ink:#f6f3ff;--mute:#a9a3c4;--gold:#f7c948;--gold2:#ffb020;--red:#ff4d6d;--green:#2ee59d;--blue:#4cc9f0;--violet:#9b5de5;--r:18px;--sh:0 18px 50px -18px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.en{direction:ltr;font-family:Poppins,system-ui,sans-serif;unicode-bidi:isolate}
.arx{direction:rtl;font-family:Cairo,system-ui,sans-serif;color:var(--blue);font-size:.92em;font-weight:600;display:block;margin-top:3px;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx .spot{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.28;animation:drift 22s ease-in-out infinite alternate}
#bgfx .s1{background:radial-gradient(circle,var(--violet),transparent 60%);top:-30vmax;left:-20vmax}
#bgfx .s2{background:radial-gradient(circle,var(--gold2),transparent 60%);bottom:-35vmax;right:-25vmax;animation-delay:-7s;opacity:.18}
#bgfx .s3{background:radial-gradient(circle,var(--red),transparent 60%);top:30%;left:40%;width:40vmax;height:40vmax;animation-delay:-13s;opacity:.12}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#bgfx .strip{position:absolute;left:-10%;width:120%;height:46px;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,255,255,.06) 14px 34px,transparent 34px 48px);border-top:6px solid rgba(255,255,255,.04);border-bottom:6px solid rgba(255,255,255,.04);animation:roll 30s linear infinite}
#bgfx .st1{top:12%;transform:rotate(-6deg)}#bgfx .st2{bottom:10%;transform:rotate(4deg);animation-direction:reverse}
@keyframes roll{to{background-position:480px 0}}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
#clap{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex;flex-direction:column}
#clap i{flex:1;background:repeating-linear-gradient(135deg,#111 0 40px,var(--gold) 40px 80px);transform:translateX(105%)}
#clap.go i{animation:wipe .9s cubic-bezier(.7,0,.2,1) forwards}
#clap.go i:nth-child(2){animation-delay:.06s}#clap.go i:nth-child(3){animation-delay:.12s}
@keyframes wipe{0%{transform:translateX(105%)}45%,55%{transform:translateX(0)}100%{transform:translateX(-105%)}}
.wrap{width:min(1100px,100%);margin:0 auto;padding:16px}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:800;background:var(--card2);border:1px solid var(--line);transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1300;border:0;box-shadow:0 10px 30px -10px var(--gold2)}
.btn.ghost{background:transparent}.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.8rem;color:var(--mute)}
.muted{color:var(--mute)}
h1,h2,h3{line-height:1.25}
.gi{display:inline-block;flex:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35));vertical-align:middle}
.gi svg{display:block}
/* motion */
.drop{display:inline-block;opacity:0;transform:translateY(-110%) rotate(-12deg);animation:drop .7s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:calc(var(--i)*35ms + var(--d,0ms))}
@keyframes drop{to{opacity:1;transform:none}}
.rise{opacity:0;transform:translateY(40px) scale(.96);animation:rise .7s cubic-bezier(.2,1.2,.3,1) forwards;animation-delay:calc(var(--i,0)*90ms + var(--d,0ms))}
@keyframes rise{to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(247,201,72,.15),0 0 40px rgba(247,201,72,.35)}}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
/* ===== presentation builds ===== */
.b{opacity:0;visibility:hidden;transform:translateY(34px) scale(.96);filter:blur(8px);transition:opacity .6s,transform .7s cubic-bezier(.2,1.3,.3,1),filter .6s,visibility 0s .6s}
.b.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .6s,transform .7s cubic-bezier(.2,1.3,.3,1),filter .6s,visibility 0s}
svg .b{transform-box:fill-box;transform-origin:center;transform:scale(.4);filter:none}
svg .b.on{transform:none}
.still .b{transition:none!important}
.still .rise,.still .drop{animation:none!important;opacity:1;transform:none}
.b:not(.on) .rise,.b:not(.on) .drop{animation-play-state:paused}
.tapzone{cursor:pointer}
.stepc{font-family:Poppins;font-weight:800;font-size:.85rem;padding:6px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.nextpulse{animation:glow .8s 3}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(11,10,18,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand b{color:var(--gold)}
.grow{flex:1}
.net{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}.net.ok{background:var(--green);box-shadow:0 0 10px var(--green)}
.timer{font-family:Poppins;font-weight:800;font-size:1.1rem;padding:6px 12px;border-radius:12px;background:#000;border:1px solid var(--line);min-width:84px;text-align:center}
.timer.low{color:var(--red)}
.prog{height:5px;background:var(--card2);position:relative}.prog i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .6s}
.hero{text-align:center;padding:24px 10px 10px}
.hero h1{font-size:clamp(2rem,6vw,4rem);font-weight:900}.hero h1 .g{color:var(--gold)}
.hero p{color:var(--mute);margin-top:8px;font-size:1.05rem}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:24px}
.sec{position:relative;padding:26px 14px;border-radius:22px;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);text-align:center;overflow:hidden;transition:transform .2s}
.sec:hover{transform:translateY(-4px)}
.sec .n{font-family:Poppins;font-size:3rem;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{width:100%;padding:14px 16px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);outline:none;margin:14px 0}
.search:focus{border-color:var(--gold)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.name{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:start;font-weight:600;display:flex;align-items:center;gap:10px}
.name:hover{border-color:var(--gold)}
.name .av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#111;font-size:.85rem}
.name.taken{opacity:.55}.name.taken::after{content:"✓ دخل";margin-inline-start:auto;font-size:.75rem;color:var(--green)}
.stagehead{text-align:center;margin:8px 0 18px}
.stagehead .ic{margin-bottom:8px}
.kicker{display:inline-flex;gap:8px;align-items:center;font-weight:800;color:var(--gold);font-size:.9rem;letter-spacing:.5px}
.stagehead h2{font-size:clamp(1.7rem,4.8vw,3rem);font-weight:900;margin-top:4px}
.stagehead .ar{color:var(--mute);margin-top:6px;font-size:1.05rem}
.qcard{max-width:780px;margin:0 auto}
.qtext{font-size:clamp(1.15rem,3vw,1.5rem);font-weight:700;line-height:1.55}
.qtr{color:var(--blue);font-weight:600;margin:6px 0 16px;font-size:1rem}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:var(--card2);border:2px solid var(--line);text-align:start;font-weight:600;font-size:1.05rem;transition:transform .15s,border-color .2s,background .2s;position:relative;overflow:hidden}
.opt:hover{border-color:var(--gold)}
.opt .k{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:900;font-family:Poppins;background:var(--bg2)}
.opt .oa{display:none;font-family:Cairo;color:var(--blue);font-size:.88rem;font-weight:600;direction:rtl}
.opt.showar .oa{display:block}
.opt.right{border-color:var(--green);background:rgba(46,229,157,.12)}.opt.wrong{border-color:var(--red);background:rgba(255,77,109,.12)}
.opt .bar{margin-inline-start:auto;font-family:Poppins;font-size:.85rem;color:var(--mute);position:relative}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.dots{display:flex;gap:6px}.dots i{width:26px;height:6px;border-radius:9px;background:var(--card2)}.dots i.on{background:var(--gold)}.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}
.olist{display:grid;gap:10px;min-height:60px;padding:10px;border-radius:16px;border:2px dashed var(--line);margin-bottom:14px}
.oitem{padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);text-align:start;line-height:1.55;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.oitem .no{flex:none;width:28px;height:28px;border-radius:8px;background:var(--gold);color:#111;font-weight:900;display:grid;place-items:center;font-family:Poppins}
.oitem.bad{border-color:var(--red)}.oitem.good{border-color:var(--green)}
.gaptext{font-size:1.12rem;line-height:2.4}
.gaptext select,.gaptext input{background:var(--bg2);border:2px solid var(--gold);border-radius:10px;padding:4px 8px;margin:0 3px;max-width:180px}
.gaptext .ok{border-color:var(--green)!important}.gaptext .no{border-color:var(--red)!important}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:6px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-family:Poppins;font-size:.9rem}
.artr{display:none;margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(76,201,240,.1);border:1px solid rgba(76,201,240,.35);color:var(--blue);line-height:1.9;direction:rtl;font-family:Cairo}
.artr.on{display:block;animation:pop .5s}
.slide{max-width:1000px;margin:0 auto}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.gcard{padding:14px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.gcard b{display:block;font-family:Poppins;margin-top:8px}.gcard small{color:var(--blue);font-weight:700}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.goal{padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.goal .t b{display:block;font-family:Poppins;font-size:1.05rem}
.goal .t .en{display:block;line-height:1.55;margin-top:4px;font-size:.95rem}
.essaymap{display:grid;gap:10px;margin-top:10px}
.emrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--card);border-inline-start:6px solid var(--c)}
.emrow>b{font-family:Poppins;color:var(--c)}
.lang{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.lang span{padding:8px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);text-align:center}
.lang span b{font-family:Poppins;display:block}.lang span small{color:var(--blue);font-weight:700}
.tvhero{width:min(420px,90%);display:block;margin:0 auto}
.tvc{opacity:0;animation:tvc 14.4s infinite}
@keyframes tvc{0%,7.5%{opacity:1}8.3%,100%{opacity:0}}
.scan{animation:scan 2.5s linear infinite}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(150px)}}
.ant{transform-origin:175px 70px;animation:ant 4s ease-in-out infinite}@keyframes ant{50%{transform:rotate(4deg)}}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.lvl{padding:22px;border-radius:22px;border:2px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%,var(--card)),var(--card));text-align:center;transition:transform .2s}
.lvl:hover{transform:translateY(-5px) rotate(-.5deg)}
.lvl h3{font-size:1.4rem;margin:8px 0 2px;color:var(--c)}
textarea.write{width:100%;min-height:170px;direction:ltr;font-family:Poppins;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:14px;line-height:1.7;resize:vertical;outline:none}
textarea.write:focus{border-color:var(--gold)}
.rubric{display:grid;gap:6px;margin-top:10px}.rubric div{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--mute)}.rubric div.on{color:var(--green)}
.waiting{text-align:center;padding:30px 10px}
.score-big{font-family:Poppins;font-size:4rem;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.reel{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;border:8px solid var(--card2);border-top-color:var(--gold);animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lockwait{text-align:center;padding:24px;border:2px dashed var(--line);border-radius:18px;color:var(--mute)}
.tlayout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media (max-width:980px){.tlayout{grid-template-columns:1fr}}
.panel{position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:10px;font-weight:800;font-size:.85rem;background:var(--card2);color:var(--mute)}.tab.on{background:var(--gold);color:#1b1300}
.plist{overflow:auto;display:grid;gap:6px;padding-inline-end:4px}
.det{background:var(--bg2);border-radius:10px;padding:8px 10px;margin-top:6px}
.prow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--card2)}
.prow .rk{font-family:Poppins;font-weight:900;text-align:center}
.prow .nm{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sub{font-size:.75rem;color:var(--mute);font-family:Poppins}
.prow .pt{font-family:Poppins;font-weight:900;color:var(--gold)}
.prow.r1{background:linear-gradient(90deg,rgba(247,201,72,.3),var(--card2))}.prow.r2{background:linear-gradient(90deg,rgba(200,210,230,.22),var(--card2))}.prow.r3{background:linear-gradient(90deg,rgba(205,127,50,.25),var(--card2))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{padding:4px 10px;border-radius:99px;font-size:.8rem;background:var(--bg2);border:1px solid var(--line)}.nchip.away{opacity:.45}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat div{background:var(--card2);border-radius:12px;padding:8px;text-align:center}.stat b{display:block;font-family:Poppins;font-size:1.4rem}.stat small{color:var(--mute);font-size:.72rem}
.ind{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ind span{font-size:.7rem;padding:3px 8px;border-radius:99px;background:rgba(76,201,240,.12);color:var(--blue);border:1px solid rgba(76,201,240,.3)}
.stagebar{display:flex;gap:4px;overflow:auto;padding:8px 16px;background:rgba(11,10,18,.6);border-bottom:1px solid var(--line)}
.sb{flex:none;padding:6px 10px;border-radius:9px;font-size:.78rem;font-weight:700;background:var(--card2);color:var(--mute);white-space:nowrap}.sb.on{background:var(--gold);color:#111}.sb.done{color:var(--green)}
.wcard{padding:12px;border-radius:12px;background:var(--card2);margin-bottom:8px}.wcard p{direction:ltr;font-family:Poppins;font-size:.85rem;line-height:1.6;margin:6px 0;white-space:pre-wrap}
.taphint{text-align:center;color:var(--mute);font-size:.85rem;margin-top:18px}
#overlay{position:fixed;inset:0;z-index:60;background:rgba(5,4,10,.94);backdrop-filter:blur(8px);display:none;overflow:auto;padding:20px}
#overlay.on{display:block;animation:pop .4s}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:30px 0 20px;min-height:280px;direction:ltr}
.pod{width:min(30%,200px);text-align:center}
.pod .blk{border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:12px;font-family:Poppins;font-size:2.4rem;font-weight:900;color:#111;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,1.3,.3,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.pod .who{font-weight:900;margin-bottom:8px;font-size:1.05rem;direction:rtl}.pod .pts{font-family:Poppins;color:var(--gold);font-weight:800}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;background:var(--card2);border:1px solid var(--gold);padding:10px 18px;border-radius:14px;font-weight:700;animation:pop .4s}
.lock{max-width:380px;margin:60px auto;text-align:center}
.lock input{width:100%;text-align:center;font-size:1.6rem;letter-spacing:8px;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin:14px 0}
.hint{margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(155,93,229,.14);border:1px solid rgba(155,93,229,.4);font-size:.95rem;display:none}.hint.on{display:block;animation:pop .4s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{text-align:center}.mt{margin-top:14px}

/* ===== 3D tiles ===== */
.opt,.oitem,.chip,.goal,.gcard,.emrow,.lang span,.name,.qtile,.task,.plate,.sec,.tstep{--tc:#2e2858;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 78%,#fff 22%) 0%,var(--tc) 48%,color-mix(in srgb,var(--tc) 82%,#000) 100%);border:1px solid rgba(255,255,255,.12);box-shadow:0 7px 0 color-mix(in srgb,var(--tc) 45%,#000),0 18px 26px -10px rgba(0,0,0,.75),inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.2)}
.opt{--tc:#30295e;margin-bottom:4px}.opt:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--tc) 45%,#000),inset 0 2px 0 rgba(255,255,255,.2)}
.opt.right{--tc:#13744f;border-color:var(--green)}.opt.wrong{--tc:#7c1f39;border-color:var(--red)}
.oitem{--tc:#2b3566}.oitem.good{--tc:#13744f}.oitem.bad{--tc:#7c1f39}
.chip{--tc:#24456b;padding:7px 14px;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 45%,#000),inset 0 2px 0 rgba(255,255,255,.25)}
.goal{--tc:#2a2452}.gcard{--tc:#2c2356}.lang span{--tc:#3b2b63;box-shadow:0 5px 0 color-mix(in srgb,var(--tc) 45%,#000),inset 0 2px 0 rgba(255,255,255,.25)}
.emrow{--tc:#262049}.name{--tc:#27214c}.sec{--tc:#2a2352}
.qtile{--tc:#352c78;display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:20px;position:relative}
.qtile .qtext{font-size:clamp(1.1rem,2.8vw,1.4rem)}.qtile .qtr{margin:4px 0 0}

/* ===== speech highlight ===== */

.kicker{display:flex;justify-content:center}

/* ===== simplified smooth motion ===== */
#bgfx .spot{animation:none!important}#bgfx .strip{display:none}
.b{opacity:0;visibility:hidden;transform:translateY(22px);filter:none!important;transition:opacity .45s ease-out,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s;will-change:opacity,transform}
.b.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease-out,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.rise{animation-duration:.5s}

#clap.go i{animation-duration:.6s}
.goalt{--tc:#5b2a86;padding:22px 24px 22px 60px;max-width:900px;margin:0 auto}.goaltxt{font-size:clamp(1.25rem,3vw,1.7rem);font-weight:800;line-height:1.5;margin:4px 0}
.goalt .tk,.task .tk{font-weight:900;font-size:.8rem;color:var(--gold)}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;max-width:960px;margin-inline:auto}
.flow{display:flex;align-items:stretch;justify-content:center;gap:10px;margin:18px auto;flex-wrap:wrap;max-width:980px}
.fnode{--tc:#2e2a66;flex:1;min-width:200px;padding:16px;border-radius:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 78%,#fff 22%),var(--tc) 48%,color-mix(in srgb,var(--tc) 82%,#000));border:1px solid rgba(255,255,255,.12);box-shadow:0 7px 0 color-mix(in srgb,var(--tc) 45%,#000),0 18px 26px -10px rgba(0,0,0,.75),inset 0 2px 0 rgba(255,255,255,.28)}
.fnode b{font-size:1.15rem;color:var(--gold)}
.farrow{align-self:center;color:var(--gold);font-size:1.8rem;font-weight:900}
.tsplit{font-size:.82rem;background:var(--bg2);border-radius:10px;padding:6px 10px;margin-bottom:8px}.tsplit b{font-family:Poppins;color:var(--gold)}
.stagehead .ar{color:var(--blue)}

/* ===== responsive fit ===== */
html,body{overflow-x:hidden;max-width:100%}
.tlayout>*,.wrap>*,.qcard,.slide,.flow>*,.crit>*,.levels>*,.goals>*{min-width:0}
svg,img{max-width:100%}
.gi svg{width:100%;height:100%}
.say,.en,.arx{overflow-wrap:anywhere}
.plate{max-width:100%}
@media (max-width:820px){
 .wrap{padding:12px}
 .tlayout{gap:12px}

 .stagehead h2{font-size:clamp(1.5rem,7vw,2.2rem)}
 .plate{padding:6px 16px 9px}
 .stagehead .gi{width:52px!important;height:52px!important}
 .qtile,.task{padding:14px 14px 14px 50px;gap:10px}
 .qtile .gi,.task .gi,.goalt .gi{width:40px!important;height:40px!important}
 .goalt{padding:16px 14px 16px 50px}
 .fnode{min-width:0;flex-basis:100%}

/* ===== pen ===== */
#penc{position:absolute;left:0;top:0;z-index:45;pointer-events:none}
body.penon #penc{pointer-events:auto;touch-action:none;cursor:crosshair}
#penbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:56;display:none;align-items:center;gap:6px;padding:8px 10px;border-radius:18px;background:rgba(20,17,36,.95);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.6);flex-wrap:wrap;justify-content:center;max-width:96vw}
body.penon #penbar{display:flex}
.pcol{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 3px 0 rgba(0,0,0,.5)}.pcol.on{border-color:#fff;transform:scale(1.15)}
.ptool{min-width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:1.05rem}.ptool.on{background:var(--gold);color:#111}
.pdone{padding:0 12px;background:var(--green);color:#062;font-weight:900;font-size:.9rem}
.psep{width:1px;height:26px;background:var(--line)}
/* ===== your turn + speed ===== */
.yourturn{display:flex;align-items:center;gap:12px;margin:-4px 0 12px;padding:10px 14px;border-radius:16px;background:linear-gradient(180deg,#ffe57a,#f7b500);color:#2a1a00;box-shadow:0 5px 0 #9a6b00,inset 0 2px 0 rgba(255,255,255,.6)}
.yourturn b{display:block;font-size:1.25rem;font-weight:900}.yourturn span{font-weight:800;font-size:.95rem}
.speedp{max-width:560px;margin:16px auto 6px;text-align:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.speedp>span{display:block;font-weight:800;margin-bottom:8px}
body.penon .toast{bottom:auto;top:110px}
:fullscreen body,:-webkit-full-screen body{overflow-y:auto}

/* ===== no page scroll: one scroll container (keeps fullscreen on iPad) ===== */
html,body{height:100%;overflow:hidden!important;overscroll-behavior:none}
#scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:smooth}
#app{min-height:100%}
.cd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cdt{display:flex;align-items:center;gap:4px;font-weight:900;min-width:58px;padding:4px 10px;border-radius:10px;background:#000;border:1px solid var(--line)}
.cdbar{flex:1;height:10px;border-radius:9px;background:var(--bg2);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.cdbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:9px}
.cd.low .cdt{color:var(--red);border-color:var(--red)}.cd.low .cdbar i{background:var(--red)}
.cd.stopped{opacity:.45}
.panel{top:118px;max-height:calc(100vh - 130px)}

/* ===== fullscreen lock ===== */
#fsback{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:90;display:none;padding:10px 18px;border-radius:14px;background:var(--gold);color:#1b1300;font-weight:900;box-shadow:0 6px 0 #9a6b00}
#fsback.on{display:block;animation:pop .4s}
#overlay,.plist,.blist{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
/* ===== bigger names & results ===== */
.tlayout{grid-template-columns:1fr 420px}
.tlayout.dash{grid-template-columns:1fr 560px}
.panel{display:flex;flex-direction:column;overflow:hidden;top:118px;height:calc(100vh - 130px);max-height:none}

.prow .sub{font-size:.9rem;margin-top:2px}
.prow .pt{font-size:1.5rem}
.stat b{font-size:1.8rem}.stat small{font-size:.85rem}

/* ===== leaderboard ===== */
#overlay.board{overflow:hidden;padding:16px}
.bwrap{height:100%;display:flex;flex-direction:column;width:min(1300px,100%);margin:0 auto}
.bhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.bhead h1{font-size:clamp(1.6rem,3.5vw,2.6rem);font-weight:900}

.blist{min-height:0;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.blist .plist{margin:0;overflow:visible}
.blist .prow{padding:16px 18px}.blist .prow .nm{font-size:1.4rem}.blist .prow .pt{font-size:1.9rem}.blist .prow .rk{font-size:1.6rem}.blist .prow .sub{font-size:1rem}
@media (max-width:900px){.bbody{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.bbody .podium{min-height:0}.pod .who{font-size:.9rem}}
.pod .who{font-size:1.1rem}
.nofs .fsb,.nofs #fsback{display:none!important}

/* ===================== LIGHT THEME (Grammar) ===================== */
:root{--bg:#ffffff;--bg2:#f6f4fc;--card:#ffffff;--card2:#f1edfb;--line:#e2dcf2;--ink:#1d1630;--mute:#6b6585;--gold:#c98400;--gold2:#f59e0b;--red:#d62839;--green:#0a8f4a;--blue:#1565c0;--violet:#7b2cbf;--sh:0 14px 34px -18px rgba(60,40,120,.35);--tr:#0f766e}
body{background:#fff;color:var(--ink)}
#bgfx .spot{opacity:.07}#bgfx .s2{opacity:.06}#bgfx .s3{opacity:.04}
.top{background:rgba(255,255,255,.92);border-bottom-color:var(--line)}
.stagebar{background:#faf9fe}
.sb{background:#efeafb;color:#5b5675}.sb.on{background:var(--gold2);color:#1b1300}.sb.done{color:var(--green)}
.timer{background:#1d1630;color:#fff;border-color:#1d1630}
.btn{background:#f4f1fb;border-color:var(--line);color:var(--ink)}
.btn.ghost{background:transparent}
.card{box-shadow:var(--sh)}
.arx,.opt .oa,.qtr,.stagehead .ar,.lang span small,.gcard small,.tstep small{color:var(--tr)!important}
.opt,.oitem,.chip,.goal,.gcard,.emrow,.lang span,.name,.qtile,.task,.plate,.sec,.tstep,.fnode,.rule,.irr,.sp,.irow,.vsc,.hero3d{color:var(--ink);border-color:rgba(60,40,120,.12)}
.opt{--tc:#f1ecff}.opt.right{--tc:#d3f5e4;border-color:var(--green)}.opt.wrong{--tc:#fde2e6;border-color:var(--red)}
.oitem{--tc:#eef2ff}.oitem.good{--tc:#d3f5e4}.oitem.bad{--tc:#fde2e6}
.chip{--tc:#e8f1ff}.goal{--tc:#f5f1ff}.gcard,.lang span{--tc:#f0ebff}.emrow,.name,.sec,.tstep{--tc:#f3efff}
.qtile{--tc:#ece6ff}.task{--tc:#fff1cc}.plate{--tc:#efe8ff;border-color:rgba(124,58,237,.35)}
.opt .k{background:#fff;color:#4c1d95;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.oitem .no{background:var(--gold2)}
.stat div,.prow{background:#f3f0fb}
.prow.r1{background:linear-gradient(90deg,rgba(247,201,72,.45),#f3f0fb)}.prow.r2{background:linear-gradient(90deg,rgba(176,186,205,.45),#f3f0fb)}.prow.r3{background:linear-gradient(90deg,rgba(205,127,50,.35),#f3f0fb)}
.tsplit,.det,.search,.lock input,textarea.write{background:#f6f4fc}
#overlay{background:rgba(255,255,255,.97)}
.cdt{background:#1d1630;color:#fff}
.hint{color:var(--ink)}
.artr{color:#0b4f8a}
.toast{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.score-big{background:linear-gradient(135deg,#7c3aed,#db2777);-webkit-background-clip:text;background-clip:text}
.plate h2{text-shadow:none}.plate h2 .drop{color:#4c1d95}
.kicker{color:#b45309}
.stagehead .ic .gi,.goal .gi{filter:drop-shadow(0 8px 12px rgba(60,40,120,.3))}
.hero h1 .g{color:#db2777}
.yourturn{box-shadow:0 5px 0 #b77900,inset 0 2px 0 rgba(255,255,255,.6)}
/* ===================== GRAMMAR COLOURS ===================== */
.g-s{color:#111111!important}.g-a{color:#0a8f4a!important}.g-v{color:#d62828!important}.g-c{color:#1565c0!important;font-weight:900}.g-r{color:#7b2cbf!important}
.gram{font-weight:700}.gram .gc.g-c{background:rgba(21,101,192,.09);border-radius:8px;padding:0 4px;box-shadow:inset 0 -3px 0 rgba(21,101,192,.35)}
.gram .w.hl{color:#1b1300!important}
.blank{display:inline-block;min-width:90px;border-bottom:3px dashed #1565c0;color:transparent!important;margin:0 3px}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px auto 16px;max-width:980px}
.lg{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 0 rgba(60,40,120,.12)}
.lg i{width:14px;height:14px;border-radius:4px;background:currentColor}.lg b{font-size:.85rem}.lg small{color:var(--mute)!important;font-weight:700}
/* ===================== KEYWORDS & MOTION ===================== */
.kw{font-weight:900;color:#db2777!important;font-size:1.15em;position:relative;display:inline-block}
.kw::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;border-radius:4px;background:linear-gradient(90deg,#f59e0b,#db2777);transform:scaleX(0);transform-origin:left}
.b.on .kw::after,.on .kw::after,.qtile .kw::after{animation:sweep .7s .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes sweep{to{transform:scaleX(1)}}
.b.on .kw{animation:kwpop .6s .25s cubic-bezier(.2,1.6,.4,1) both}
@keyframes kwpop{0%{transform:scale(.6) translateY(8px);opacity:0}100%{transform:none;opacity:1}}
.b{transform:translateY(30px) scale(.94);transition:opacity .5s ease-out,transform .6s cubic-bezier(.2,1.25,.3,1),visibility 0s .5s}
.b.on{transition:opacity .5s ease-out,transform .6s cubic-bezier(.2,1.25,.3,1),visibility 0s}
.b.fl{transform:translateX(70px) rotate(2deg)}.b.fr{transform:translateX(-70px) rotate(-2deg)}
.b.fl.on,.b.fr.on{transform:none}
.b.on .rise{animation:rise .55s cubic-bezier(.2,1.25,.3,1) both;animation-delay:calc(var(--i,0)*90ms + 150ms)}
.hero3d{--tc:#f3edff;text-align:center;padding:26px 22px;border-radius:26px;max-width:980px;margin:0 auto 16px;background:linear-gradient(180deg,#fff,#efe8ff);border:1px solid rgba(124,58,237,.25);box-shadow:0 8px 0 #cfc2f5,0 24px 40px -18px rgba(60,40,120,.45)}
.goalbig{font-size:clamp(1.5rem,3.6vw,2.6rem);font-weight:800;line-height:1.45}
.goalbig .kw{font-size:1.3em}
.arx.big{font-size:1.15rem;margin-top:8px}
.vs{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px auto 14px;max-width:820px}
.vsc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;border-radius:22px;background:linear-gradient(180deg,#fff,#eef4ff);border:1px solid var(--line);box-shadow:0 7px 0 #cfdcf5,0 18px 28px -14px rgba(30,60,140,.35)}
.vsc b{font-size:1.6rem}.vsc small{color:var(--tr);font-weight:800}
.vsx{font-family:Poppins;font-weight:900;font-size:1.6rem;color:#db2777;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1080px;margin:0 auto}
.rule{padding:16px 18px;border-radius:22px;background:linear-gradient(180deg,#fff,#f4f0ff);border:1px solid var(--line);box-shadow:0 7px 0 #d9cff5,0 20px 30px -16px rgba(60,40,120,.4)}
.rh{display:flex;align-items:center;gap:12px;margin-bottom:10px}.big2{font-size:1.5rem}
.pat{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;font-weight:700}
.pc{padding:4px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 0 rgba(60,40,120,.12)}
.ex{margin:8px 0;padding:8px 12px;border-radius:12px;background:#fff;border-inline-start:4px solid #1565c0;font-size:1.12rem;line-height:1.7}
.spell{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px auto 0;max-width:1000px}
.sp{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;background:linear-gradient(180deg,#fff,#eef4ff);border:1px solid var(--line);box-shadow:0 5px 0 #cfdcf5;font-size:1.1rem}
.sp small{color:var(--tr);font-weight:800;font-size:.8rem}
.irr{padding:16px 18px;border-radius:22px;max-width:1000px;margin:0 auto;background:linear-gradient(180deg,#fff,#fff6e6);border:1px solid #f3dfb5;box-shadow:0 7px 0 #f0d9a8,0 20px 30px -16px rgba(150,90,0,.35)}
.irh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.itab{display:grid;gap:8px}
.irow{display:grid;grid-template-columns:1.1fr 1.3fr 1.6fr .9fr;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid #f3e3c2;font-size:1.08rem}
.irow small{color:var(--tr);font-weight:800}
.chart{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;box-shadow:0 5px 0 #ddd3f5;font-size:.9rem}
.crow{display:grid;grid-template-columns:1.3fr 1.6fr 1fr .7fr;gap:6px;padding:6px 10px;align-items:center;background:#fff}
.crow:nth-child(even){background:#f6f3ff}.crow.ch{background:#4c1d95;color:#fff;font-size:.78rem}
.crow b{display:flex;align-items:center;gap:6px}
.waitgo{text-align:center;padding:30px 20px}.lockic{font-size:3rem;animation:pulse 1.6s infinite}
.dotsw{display:flex;gap:8px;justify-content:center;margin-top:12px}.dotsw i{width:12px;height:12px;border-radius:50%;background:#7c3aed;animation:pulse 1s infinite}.dotsw i:nth-child(2){animation-delay:.2s}.dotsw i:nth-child(3){animation-delay:.4s}
.gobig{display:inline-flex;flex-direction:column;font-size:1.45rem;padding:18px 34px;border-radius:20px}.gobig small{font-size:.85rem;font-weight:700;opacity:.8}
.timer.big{font-size:1.35rem;min-width:150px}.timer.big small{font-size:.7rem;opacity:.8}.timer.run{background:#0a8f4a}.timer.low{background:#d62839;color:#fff}.timer.over{background:#d62839;animation:glow 1s infinite}
.exc{position:relative;display:inline-grid;grid-template-columns:auto auto auto auto;gap:4px 12px;align-items:center;padding:14px 22px 20px;border-radius:18px;background:#1d1630;color:#fff;overflow:hidden;font-size:1rem}
.exc b{font-size:2rem;font-weight:900}.exc span{opacity:.8;font-weight:700}

 sec:null,es:null,bc:null,seen:new Set(),handlers:[],ok:false,lastId:null,polling:false,

   }catch(e){this.setOk(false)}
 },

   try{this.bc=new BroadcastChannel(this.topic());this.bc.onmessage=e=>this.emit(e.data)}catch(e){}

   const poll=async()=>{
     if(this.polling)return;this.polling=true;
     while(this.polling){try{const r=await fetch(`${RELAY}/${this.topic()}/json?poll=1&since=${this.lastId||'2m'}`);if(r.ok){this.setOk(true);(await r.text()).split('\n').filter(Boolean).forEach(l=>{try{handle(JSON.parse(l))}catch(_){}})}else this.setOk(false)}catch(e){this.setOk(false)}

function studentMsg(m,mine){
 if(m.t==='join'&&!mine){S.joins.push(m);S.redrawNames&&!S.me&&S.redrawNames()}
 if(m.t==='ctl'){
  const newSid=m.sid!==S.sid;if(!newSid&&m.stage<S.stage&&S.ahead)return;if(m.stage>=S.stage)S.ahead=false;
  const wasGo=S.goStage===S.stage;const changed=newSid||m.stage!==S.stage;
  S.sid=m.sid;S.stage=m.stage;S.step=99;S.goStage=m.go?m.stage:-1;S.goAt=m.goAt||0;
  if(newSid&&S.me)Net.send({t:'join',sid:S.sid,id:S.me.id,name:S.me.name,extra:!!S.me.extra});
  if(!S.me)return;
  if(changed){clap();setTimeout(renderStudent,300)}else if(!wasGo&&S.goStage===S.stage){clap();setTimeout(renderStudent,250)}
 }
}
function myTotal(){return Object.entries(S.done).filter(([k])=>k.startsWith(S.sid+':'+S.me.id+':')).reduce((a,[,v])=>a+v.pts,0)}

 $('#lo').onclick=()=>{if(confirm('تسجيل الخروج وتغيير الاسم؟')){LS.set('me',null);location.reload()}};
 $('#ttsb').onclick=()=>{TTS.sel.auto=!TTS.sel.auto;TTS.save();$('#ttsb').textContent=TTS.sel.auto?'🔊':'🔇';if(!TTS.sel.auto)TTS.stop();toast(TTS.sel.auto?'القراءة الصوتية التلقائية مفعّلة':'القراءة الصوتية التلقائية متوقفة — اضغط 🔊 بجانب أي سؤال للاستماع')};
 TTS.stop();$('#scroller').scrollTo({top:0});const main=$('#main');
 if(!S.sid||!st){main.innerHTML=`<div class="waiting"><div class="bob" style="display:inline-block">${GI('tv',90)}</div><h2 class="mt">${dropText('أهلًا '+S.me.name.split(' ')[0]+' 👋')}</h2><p class="en mt">Welcome! Wait for your teacher to start.</p><p class="muted">تم تسجيل حضورك. انتظر حتى يبدأ المعلم العرض…</p></div>`;return}
 main.innerHTML=stageHead(st)+introExtra(st)+'<div id="ex"></div>';

 if(st.type==='slide'){ex.innerHTML=slideBody(st)+`<div class="center mt">${nextBtn()}</div>`;bindNext(ex);applySteps(main,S.step);return}
 if(st.type==='podium'){ex.innerHTML=`<div class="waiting b"><div class="score-big pop">${myTotal()}</div><h3 class="en">Your total points</h3><p class="muted">مجموع نقاطك — شاهد شاشة المعلم لمعرفة نجوم الحصة 🏆</p></div>`;applySteps(main,S.step);confetti();return}
 ex.className='b';
 if(S.done[key]){showDone(ex,S.done[key]);applySteps(main,S.step);return}
 if(S.goStage!==S.stage){ex.innerHTML=`<div class="waitgo card qcard"><div class="lockic">🔒</div><h3 class="en">Wait for your teacher…</h3><p>انتظر حتى يضغط المعلم «ابدأ الحل»، ثم يبدأ العدّاد.</p><div class="dotsw"><i></i><i></i><i></i></div></div>`;applySteps(main,S.step);return}
 let t0=null;ex.addEventListener('shown',()=>{t0=performance.now()},{once:true});
 S.qsend=r=>Net.send({t:'q',sid:S.sid,id:S.me.id,name:S.me.name,stage:st.id,...r});
 const done=({acc,detail,pts:p0,ms:m0})=>{
  const ms=m0!=null?m0:Math.round(performance.now()-(t0||performance.now()));const pts=st.type==='poll'?20:p0!=null?p0:points(st,acc,ms,detail&&detail.tier);
  const rec={pts,acc,ms,detail};S.done[key]=rec;LS.set('done',S.done);
  Net.send({t:'ans',sid:S.sid,id:S.me.id,name:S.me.name,stage:st.id,pts,acc,ms,detail});
  if(acc>=.75)confetti();setTimeout(()=>{$('#mypts')&&($('#mypts').textContent=myTotal());showDone(ex,rec)},300);
 };
 ({mcq:buildMCQ,order:buildOrder,gaps:buildGaps,tier:buildTier,poll:buildPoll})[st.type](ex,st,done);
 applySteps(main,S.step);
}
function nextStage(){let i=S.stage+1;while(i<STAGES.length&&STAGES[i].type==='slide')i++;return i<STAGES.length?i:-1}
function nextBtn(){const i=nextStage();return i<0?'':`<button class="btn gold mt nxs" style="font-size:1.05rem">التمرين التالي ⬅ <span class="en">${esc(STAGES[i].title)}</span></button>`}
function bindNext(root){const b=$('.nxs',root);if(b)b.onclick=()=>{const i=nextStage();if(i<0)return;S.stage=i;S.ahead=true;clap();setTimeout(renderStudent,300)}}
function showDone(ex,r){
 const pct=Math.round(r.acc*100);const msg=pct===100?['Perfect! 🌟','إتقان كامل!']:pct>=75?['Great job! 👏','أداء رائع']:pct>=50?['Good, keep going 💪','جيد، واصل التقدم']:['Keep trying 🌱','لا بأس، سنتقدم معًا'];
 ex.innerHTML=`<div class="waiting card qcard pop"><div class="muted">Points · نقاطك في هذه المرحلة</div><div class="score-big">+${r.pts}</div><div class="row" style="justify-content:center"><span class="pill">🎯 ${pct}%</span><span class="pill">⏱️ ${fmt(r.ms)}</span>${r.detail&&r.detail.tier?`<span class="pill">${TIERS[r.detail.tier].ar}</span>`:''}</div><h3 class="mt en">${msg[0]}</h3><div class="arx" style="font-size:1.1rem">${msg[1]}</div><p class="muted mt">يمكنك الانتقال للتمرين التالي الآن، أو انتظار المعلم.</p>${nextBtn()}</div>`;bindNext(ex);
}

function newSession(){T.sid=new Date().toISOString().slice(0,10)+'-'+rnd().slice(0,5);T.stage=0;T.step=1;T.reveal=false;T.go=false;T.goAt=0;T.start=Date.now();replay();clap();teacherRender();broadcast()}
function broadcast(){Net.send({t:'ctl',sid:T.sid,stage:T.stage,step:T.step,start:T.start,reveal:T.reveal,go:T.go,goAt:T.goAt})}
function startEx(){const st=STAGES[T.stage];if(!EX.includes(st.type)||T.go)return;T.go=true;T.goAt=Date.now();broadcast();setStep(T.nsteps);clap();toast('▶ بدأ الحل — العدّاد يعمل الآن');setTimeout(()=>NAR.say(NARR_GO[st.id]),550);updateLive();tick();const g=$('#gob');if(g)g.remove()}
let bT;function broadcastSoon(){clearTimeout(bT);bT=setTimeout(broadcast,350)}
function person(id,name){return T.people[id]||(T.people[id]={id,name,joined:0,ans:{}})}
function teacherMsg(m,mine){
 if(m.t==='ctl'){T.lastCtl=m;return}
 if(m.t==='hello'){if(!mine&&T.sid&&(!Net.ok||Date.now()-(T.lastHello||0)>15000)){T.lastHello=Date.now();setTimeout(broadcast,500)}return}
 T.log.push(m);if(applyMsg(m))scheduleUpdate();
}
function applyMsg(m){
 if(!T.sid)return false;
 if(m.sid!==T.sid&&!(m.t==='join'&&!m.sid&&Date.now()-m.ts<3600e3))return false;
 if(m.t==='join'){const p=person(m.id,m.name);p.joined=p.joined||m.ts;p.extra=m.extra}
 if(m.t==='ans'){const p=person(m.id,m.name);p.joined=p.joined||m.ts;if(!p.ans[m.stage])p.ans[m.stage]={pts:m.pts,acc:m.acc,ms:m.ms,detail:m.detail,ts:m.ts}}
 if(m.t==='q'){const p=person(m.id,m.name);p.joined=p.joined||m.ts;p.q=p.q||{};const g=p.q[m.stage]=p.q[m.stage]||{};if(!g[m.qi])g[m.qi]={k:m.k,ok:m.ok,ms:m.ms,pts:m.pts,n:m.n}}
 return true;
}
function replay(){T.people={};T.log.forEach(applyMsg)}
let upT;function scheduleUpdate(){clearTimeout(upT);upT=setTimeout(()=>{teacherPanel();updateLive()},250)}
function rosterPeople(){const list=ROSTER[T.sec].map((n,i)=>({id:T.sec+'-'+i,name:n}));Object.values(T.people).forEach(p=>{if(!list.find(x=>x.id===p.id))list.push({id:p.id,name:p.name})});return list.map(x=>({...x,p:T.people[x.id]}))}
function liveRec(p,stid){if(p.ans[stid])return p.ans[stid];const g=p.q&&p.q[stid];if(!g)return null;const v=Object.values(g);const n=v[0].n;const c=v.filter(x=>x.ok).length;return{partial:true,pts:v.reduce((a,x)=>a+x.pts,0),ms:v.reduce((a,x)=>a+x.ms,0),acc:c/n,detail:{c,n,done:v.length,ans:Object.keys(g).sort((a,b)=>a-b).map(i=>g[i].k)}}}
function stageRanking(stid){return Object.values(T.people).map(p=>({p,r:liveRec(p,stid)})).filter(x=>x.r).sort((a,b)=>b.r.pts-a.r.pts||a.r.ms-b.r.ms)}
function overall(){return Object.values(T.people).map(p=>{const v=STAGES.map(s=>liveRec(p,s.id)).filter(Boolean);return{p,pts:v.reduce((a,r)=>a+r.pts,0),ms:v.reduce((a,r)=>a+r.ms,0),n:v.length,acc:v.length?v.reduce((a,r)=>a+r.acc,0)/v.length:0}}).sort((a,b)=>b.pts-a.pts||a.ms-b.ms)}

  b.disabled=false;gst(r.daily?`⛔ انتهت حصة اليوم المجانية من Google لهذا المفتاح (جاهز ${r.ok} من ${r.n}). فعّل الفوترة في Google AI Studio ثم اضغط التجهيز مرة ثانية — يكمل من حيث وقف.`:r.rate?`⛔ Google رفض الطلبات بسبب الحد (جاهز ${r.ok} من ${r.n}). اضغط التجهيز لاحقًا — يكمل من حيث وقف.`:r.stop?`⚠️ توقف التجهيز: ${esc(r.stop.msg||r.stop.message)}`:`✅ جاهز ${r.ok} من ${r.n} مقطعًا — ستعمل الأصوات فورًا أثناء الحصة`)};
}
function exportCSV(){
 const ids=STAGES.filter(s=>!['slide','podium'].includes(s.type));
 const head=['#','الاسم','حاضر',...ids.map(s=>s.title),'المجموع','متوسط الإتقان %','مستوى الكتابة','التقويم الذاتي','نص الكتابة'];
 const o=overall();const rank=new Map(o.map((x,i)=>[x.p.id,i+1]));
 const rows=rosterPeople().map(x=>{const p=x.p||{ans:{}};const v=Object.values(p.ans);const tot=v.reduce((a,r)=>a+r.pts,0);
  return[rank.get(x.id)||'',x.name,p.joined?'نعم':'لا',...ids.map(s=>p.ans[s.id]?p.ans[s.id].pts:''),tot,v.length?Math.round(v.reduce((a,r)=>a+r.acc,0)/v.length*100):'',p.ans.write?TIERS[p.ans.write.detail.tier].ar:'',p.ans.exit&&p.ans.exit.detail.self?['','أحتاج تدريبًا','أحتاج مساعدة بسيطة','واثق'][p.ans.exit.detail.self]:'',p.ans.write?p.ans.write.detail.text:'']});
 const csv='﻿'+[head,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`نتائج_درس_الكتابة_الشعبة_${T.sec}.csv`;document.body.append(a);a.click();a.remove();
}
if(location.hash==='#teacher'||window.TEACHER_PAGE)teacherLock();else studentStart();
</script>
